<!DOCTYPE html>

<html lang="ko">
<head>
<script>
(function () {
  var LIMIT = 180; // 체험 시간(초)
  var KEY = "kpri_demo_start_" + location.pathname;
  var start = 0;
  try { start = Number(sessionStorage.getItem(KEY)) || 0; } catch (e) {}
  if (!start) { start = Date.now(); try { sessionStorage.setItem(KEY, String(start)); } catch (e) {} }
  var ctxs = [], auds = [];
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      var WAC = function () { var c = new AC(...arguments); ctxs.push(c); return c; };
      WAC.prototype = AC.prototype;
      window.AudioContext = WAC; window.webkitAudioContext = WAC;
    }
    var AU = window.Audio;
    if (AU) {
      var WAU = function () { var a = new AU(...arguments); auds.push(a); return a; };
      WAU.prototype = AU.prototype;
      window.Audio = WAU;
    }
  } catch (e) {}
  var css = document.createElement("style");
  css.textContent = "#kpriDemoBadge{position:fixed;left:12px;bottom:12px;z-index:2147483646;padding:7px 14px;border-radius:999px;background:rgba(22,33,62,.88);color:#FFE45C;font:700 14px/1.2 sans-serif;pointer-events:none;letter-spacing:.02em}" +
    "#kpriDemoLock{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:rgba(10,14,28,.94);padding:24px}" +
    "#kpriDemoLock .box{max-width:560px;width:100%;background:#fff;border-radius:22px;padding:36px 32px;text-align:center;font-family:sans-serif;color:#16213E;box-shadow:0 20px 60px rgba(0,0,0,.4)}" +
    "#kpriDemoLock .tag{display:inline-block;padding:4px 12px;border-radius:999px;background:#FFE45C;font-weight:900;font-size:14px;margin-bottom:14px}" +
    "#kpriDemoLock h2{margin:0 0 12px;font-size:28px;line-height:1.3}" +
    "#kpriDemoLock p{margin:0 0 8px;font-size:17px;line-height:1.6;color:#3A4460}" +
    "#kpriDemoLock .tel{margin-top:18px;font-size:22px;font-weight:900;color:#0B7A68}";
  (document.head || document.documentElement).appendChild(css);
  var badge = document.createElement("div");
  badge.id = "kpriDemoBadge";
  function mount() { if (document.body && !badge.parentNode) document.body.appendChild(badge); }
  function lock() {
    if (!document.body || document.getElementById("kpriDemoLock")) return;
    var o = document.createElement("div");
    o.id = "kpriDemoLock";
    o.innerHTML = "<div class=\"box\"><div class=\"tag\">체험판</div><h2>체험 시간이 끝났습니다</h2><p>이 게임은 3분 체험용으로 제공됩니다.</p><p>실제 수업 운영은 한국가이던스 · 한국심리연구원으로 문의해 주세요.</p><div class=\"tel\">070-8785-1234</div></div>";
    ["click", "mousedown", "touchstart", "keydown", "wheel"].forEach(function (ev) {
      o.addEventListener(ev, function (e) { e.stopPropagation(); e.preventDefault(); }, true);
    });
    document.body.appendChild(o);
    document.addEventListener("keydown", function (e) { e.stopPropagation(); e.preventDefault(); }, true);
  }
  function stopMedia() {
    document.querySelectorAll("audio,video").forEach(function (m) { try { m.pause(); m.muted = true; } catch (e) {} });
    auds.forEach(function (a) { try { a.pause(); a.muted = true; } catch (e) {} });
    ctxs.forEach(function (c) { try { if (c.state === "running") { var pr = c.suspend(); if (pr && pr.catch) pr.catch(function () {}); } } catch (e) {} });
  }
  function tick() {
    mount();
    var left = Math.max(0, LIMIT - Math.floor((Date.now() - start) / 1000));
    var m = Math.floor(left / 60), s = left % 60;
    badge.textContent = "체험판 · " + m + ":" + (s < 10 ? "0" : "") + s;
    if (left <= 0) { badge.textContent = "체험판 · 종료"; lock(); stopMedia(); }
  }
  setInterval(tick, 1000);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tick); else tick();
})();
</script>

    @keyframes cloudFlash { 
      0% { filter: drop-shadow(0 0 2px rgba(59,130,246,0.3)); opacity: 0.7; transform: translateX(-50%) scale(0.95); } 
      100% { filter: drop-shadow(0 0 20px #3B82F6) drop-shadow(0 0 10px #FFCC33); opacity: 1; transform: translateX(-50%) scale(1.05); }

    .fx-music-float span { font-size: 1.8rem; position: absolute; animation: musicDance 1s infinite alternate ease-in-out; }
    .fx-music-float span:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
    .fx-music-float span:nth-child(2) { top: 30%; right: 20%; animation-delay: 0.3s; }
    .fx-music-float span:nth-child(3) { bottom: 30%; left: 35%; animation-delay: 0.6s; }
    @keyframes musicDance { 
      0% { transform: translateY(0) translateX(0) rotate(-10deg) scale(0.9); opacity: 0.5; } 
      100% { transform: translateY(-12px) translateX(8px) rotate(15deg) scale(1.2); opacity: 1; } 
    }

    .fx-hand-wave { position: absolute; bottom: 30px; right: 25px; font-size: 2.5rem; animation: handWaveAnim 0.35s infinite alternate ease-in-out; transform-origin: bottom right; }
    @keyframes handWaveAnim { 
      0% { transform: rotate(-15deg) scale(1); } 
      100% { transform: rotate(25deg) scale(1.15); filter: drop-shadow(0 0 8px var(--gold)); } 
    }

    .sim-container { display: grid; grid-template-columns: 1fr; gap: 10px; height: 100%; align-content: center; }
    .sim-board-wrapper { position: relative; background: #0e1322; border: 2px solid var(--gold-accent); border-radius: 12px; padding: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    .sim-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sim-card { background: #181d2c; border: 1px solid var(--border-color); border-radius: 8px; padding: 6px; text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; }
    .sim-card-header { font-size: 0.75rem; font-weight: 800; color: var(--gold); margin-bottom: 4px; }
    .sim-card-slot { width: 100%; min-height: 45px; border: 2px dashed rgba(255,204,51,0.5); border-radius: 6px; background: rgba(0,0,0,0.5); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; cursor: pointer; padding: 4px; transition: all 0.2s; position: relative; }
    .sim-card-slot:hover { border-color: var(--gold); background: rgba(234, 179, 8, 0.15); }
    
    .player-dock-row { display: flex; justify-content: space-between; gap: 10px; background: rgba(20,20,30,0.9); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); align-items: center; }
    .player-dock-title { font-size: 0.85rem; font-weight: 800; color: var(--gold-accent); min-width: 70px; }
    .chip-tray { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    
    .sim-chip { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 900; cursor: grab; box-shadow: 0 3px 6px rgba(0,0,0,0.4); user-select: none; transition: transform 0.2s, filter 0.2s; border: 2px solid #fff; }
    .sim-chip:hover { transform: scale(1.15); filter: brightness(1.2); }
    .chip-wrong { background: var(--red-accent); color: #fff; }
    .chip-trap { background: var(--gold-accent); color: #000; }
    .chip-correct { background: var(--blue-accent); color: #fff; }

    .chip-bluff { 
      width: 70px; 
      height: 30px; 
      border-radius: 6px; 
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-accent) 100%); 
      color: #000; 
      border: 2px solid #fff; 
      font-size: 0.65rem; 
      font-weight: 900; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: grab; 
      box-shadow: 0 4px 10px rgba(234,179,8,0.4); 
      user-select: none; 
      transition: transform 0.2s, filter 0.2s; 
    }
    .chip-bluff:hover { transform: scale(1.1); filter: brightness(1.15); }

    .placed-chip { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 900; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.5); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    .placed-bluff-card { 
      width: 60px; 
      height: 24px; 
      border-radius: 4px; 
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-accent) 100%); 
      color: #000; 
      border: 1.5px solid #fff; 
      font-size: 0.55rem; 
      font-weight: 900; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.5); 
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    .flip-card-container { width: 100%; height: 350px; perspective: 1000px; margin-bottom: 12px; cursor: pointer; }
    .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    .flip-card-container.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
    .flip-card-front { background: linear-gradient(135deg, #181820 0%, #111116 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed var(--gold-accent); color: var(--gold-accent); }
    .flip-card-front .card-emblem { font-size: 3.5rem; margin-bottom: 10px; animation: pulseEmblem 1.5s infinite alternate; }
    @keyframes pulseEmblem { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }
    .flip-card-front .card-guide-text { font-size: 1.1rem; font-weight: 700; color: #FFF; background: rgba(234, 179, 8, 0.15); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--gold-accent); }
    .flip-card-back { background: #000; transform: rotateY(180deg); }
    .flip-card-back img { width: 100%; height: 100%; object-fit: contain; }

    .answer-btn { background: var(--gold-accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; }
    .answer-btn:hover { background: #CA8A04; }
    .answer-reveal { display: none; background: #14141E; border-left: 4px solid var(--gold-accent); padding: 14px; border-radius: 0 8px 8px 0; margin-top: 10px; }
    .answer-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 0.9rem; }
    .answer-table th, .answer-table td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
    .answer-table th { background: #1F1F2B; color: var(--gold-accent); }

    .nav-bar { display: flex; gap: 16px; align-items: center; margin-top: 8px; }
    .nav-btn { background: #181820; color: var(--gold-accent); border: 1px solid var(--border-color); padding: 8px 22px; border-radius: 30px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
    .nav-btn:hover { background: var(--gold-accent); color: #000; }
    .page-indicator { color: var(--text-sub); font-weight: bold; font-size: 1rem; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--panel-bg); border: 2px solid var(--gold-accent); border-radius: 14px; max-width: 950px; width: 90%; max-height: 90vh; padding: 24px; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 0 30px rgba(234, 179, 8, 0.3); }
    .modal-close { position: absolute; top: 14px; right: 18px; font-size: 2rem; color: var(--gold-accent); cursor: pointer; font-weight: bold; }
    .modal-img { max-width: 100%; max-height: 55vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 10px; }
    .modal-title { color: var(--gold-accent); font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; }
    .modal-body { color: #E5E7EB; font-size: 1rem; line-height: 1.6; margin-top: 15px; width: 100%; text-align: left; background: rgba(0,0,0,0.4); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border-color); max-height: 22vh; overflow-y: auto; }



    /* Mind Dealer elementary neon theme */
    :root {
      --neon-blue: #65D8FF;
      --neon-cyan: #7DEBFF;
      --neon-purple: #B778FF;
      --neon-pink: #FF63D8;
      --mind-yellow: #FFD86B;
      --panel-bg: #081225;
      --card-bg: rgba(12, 22, 44, 0.86);
      --border-color: rgba(120, 216, 255, 0.34);
      --gold: #FFD86B;
      --gold-accent: #65D8FF;
      --text-bright: #F5FBFF;
      --text-sub: #B8C8DD;
      --muted: #96A9C2;
    }

    body {
      background-color: #050B18;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(101,216,255,0.22) 0%, transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(183,120,255,0.20) 0%, transparent 30%),
        linear-gradient(180deg, #060b18 0%, #030612 100%);
    }

    .game-board {
      background:
        linear-gradient(135deg, rgba(8,18,37,0.98) 0%, rgba(8,12,32,0.96) 55%, rgba(16,8,38,0.95) 100%);
      border: 1.8px solid rgba(125,235,255,0.38);
      box-shadow: 0 0 0 1px rgba(183,120,255,0.18), 0 22px 60px rgba(0,0,0,0.75), inset 0 0 40px rgba(101,216,255,0.05);
    }

    .game-board::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(125,235,255,0.18);
      border-radius: 14px;
      pointer-events: none;
      z-index: 0;
    }

    .game-board > * { position: relative; z-index: 2; }

    .board-header {
      border-bottom: 1px solid rgba(125,235,255,0.24);
    }

    .header-badge, .card-id, .step-num {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      color: #03101E;
      box-shadow: 0 0 18px rgba(101,216,255,0.26);
    }

    .board-title, .info-panel h3, .info-panel h4 {
      color: var(--neon-cyan) !important;
      text-shadow: 0 0 12px rgba(101,216,255,0.26);
    }

    .info-panel, .step-item, .board-card {
      background: rgba(8, 18, 37, 0.78) !important;
      border-color: rgba(125,235,255,0.28) !important;
      box-shadow: 0 10px 26px rgba(0,0,0,0.22), inset 0 0 18px rgba(101,216,255,0.035);
    }
.cover-slide {
      padding: 0 !important;
      background: #050b18 !important;
    }

    .cover-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(circle at 50% 48%, rgba(255,255,255,0.05), transparent 35%),
        linear-gradient(180deg, rgba(3,6,18,0.08) 0%, rgba(3,6,18,0.10) 58%, rgba(3,6,18,0.74) 100%);
    }
    .elementary-badge {
      position:absolute;
      top: 28px;
      right: 38px;
      z-index: 5;
      padding: 10px 18px;
      border-radius: 999px;
      color: #061325;
      background: linear-gradient(135deg, #BFF4FF, #FFD86B);
      font-weight: 900;
      letter-spacing: -0.02em;
      box-shadow: 0 0 24px rgba(101,216,255,0.45), 0 8px 22px rgba(0,0,0,0.36);
      border: 2px solid rgba(255,255,255,0.65);
    }
    .cover-bottom-bar {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 34px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-radius: 18px;
      background: rgba(4,12,28,0.68);
      border: 1px solid rgba(125,235,255,0.38);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(101,216,255,0.18);
    }
    .cover-goal-title { font-size: 1rem; color: var(--neon-cyan); font-weight: 900; margin-bottom: 4px; }
    .cover-goal-desc { color: #EAF8FF; font-size: .95rem; line-height: 1.45; }
    .cover-chip { white-space: nowrap; font-weight: 900; color:#061325; background: linear-gradient(135deg, #FFD86B, #FF95E3); border-radius: 999px; padding: 10px 16px; }

    .neon-title {
      font-size: clamp(38px, 4.7vw, 66px);
      line-height: 1.12;
      font-weight: 900;
      color: #F5FBFF;
      text-shadow: 0 0 12px rgba(101,216,255,0.5), 0 0 34px rgba(183,120,255,0.35);
      letter-spacing: -0.04em;
    }
    .neon-title strong { color: var(--neon-cyan); }
    .glass-note {
      background: rgba(8,18,37,0.74);
      border: 1px solid rgba(125,235,255,0.28);
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.32), inset 0 0 24px rgba(101,216,255,0.04);
    }
    .mind-grid { display: grid; gap: 14px; }
    .mind-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .mind-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .mind-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .mind-card {
      background: rgba(9,20,44,0.82);
      border: 1px solid rgba(125,235,255,0.28);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      min-height: 120px;
    }
    .mind-card.big { min-height: 160px; }
    .mind-card .icon { font-size: 2.1rem; margin-bottom: 8px; filter: drop-shadow(0 0 12px rgba(101,216,255,0.22)); }
    .mind-card h3, .mind-card h4 { color: var(--neon-cyan); margin-bottom: 8px; font-size: 1.12rem; }
    .mind-card p, .mind-card li { color: var(--text-sub); line-height: 1.55; font-size: .95rem; word-break: keep-all; }
    .mind-card strong { color: #fff; }
    .score-lane {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:18px;
      border-radius:16px;
      background:rgba(6,14,31,0.86);
      border:1px solid rgba(125,235,255,0.25);
      min-height: 98px;
    }
    .score-label { font-weight:900; font-size:1.25rem; color:#fff; }
    .score-desc { color:var(--text-sub); font-size:.93rem; line-height:1.45; margin-top:4px; }
    .score-point { font-size:2.4rem; font-weight:900; color:var(--mind-yellow); text-shadow:0 0 18px rgba(255,216,107,.45); white-space:nowrap; }
    .round-flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: stretch; }
    .flow-box { padding: 16px 12px; border-radius: 16px; background: rgba(9,20,44,0.82); border: 1px solid rgba(125,235,255,0.25); text-align:center; min-height: 150px; display:flex; flex-direction:column; justify-content:center; }
    .flow-num { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:999px; margin:0 auto 8px; background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple)); color:#04101F; font-weight:900; }
    .flow-title { font-weight:900; color:#fff; margin-bottom:6px; font-size:1rem; }
    .flow-desc { color:var(--text-sub); font-size:.82rem; line-height:1.4; }
    .chip-demo { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .team-chip { width:42px; height:42px; border-radius:50%; border:3px solid rgba(255,255,255,.82); box-shadow:0 0 14px rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-weight:900; color:white; font-size:.78rem; }
    .team-chip.blue { background:#2E8CFF; } .team-chip.red { background:#FF4D6D; } .team-chip.yellow { background:#FFC531; color:#061325; } .team-chip.green { background:#2AD67D; color:#061325; }
    .strategy-box { border-left: 4px solid var(--neon-cyan); padding: 14px 16px; background: rgba(125,235,255,.06); border-radius: 12px; }
    .pulse-soft { animation: softPulse 1.8s infinite ease-in-out; }
    @keyframes softPulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(101,216,255,.25)); } 50% { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(183,120,255,.45)); } }
    .countdown-dots { display:flex; justify-content:center; gap:18px; margin: 18px 0; }
    .countdown-dots span { width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:900; background:rgba(9,20,44,0.92); border:2px solid var(--neon-cyan); color:#fff; animation: dotGlow 1.2s infinite alternate; }
    .countdown-dots span:nth-child(2) { animation-delay:.2s; } .countdown-dots span:nth-child(3) { animation-delay:.4s; }
    @keyframes dotGlow { from { box-shadow:0 0 8px rgba(101,216,255,.2); } to { box-shadow:0 0 28px rgba(101,216,255,.55); transform: translateY(-4px); } }

    @media (max-width: 1024px) {
      .game-board { width: 100%; height: auto; min-height: 700px; }
      .hero-content { max-width: 100%; padding: 80px 30px 120px 30px; }
      .goal-bar { flex-direction: column; align-items: flex-start; }
      .grid-slide-step { grid-template-columns: 1fr; }
    }
